<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyDesk — Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="tasks">

<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <h1>StudyDesk</h1>
            <p>3rd Year B.Tech AIDS</p>
        </div>

        <nav class="nav">
            <a data-page="dashboard" href="index.html">▦ Dashboard</a>
            <a data-page="tasks" href="tasks.html">☰ Tasks</a>
            <a data-page="schedule" href="schedule.html">▤ Schedule</a>
            <a data-page="exams" href="exams.html">🎓 Exams</a>
            <a data-page="calendar" href="calendar.html">▦ Calendar</a>
            <a data-page="stats" href="stats.html">📊 Stats</a>
        </nav>

        <div class="side-note">
            Personal study planner<br>
            AI & Data Science
        </div>
    </aside>

    <main>
        <div class="eyebrow">To-do list</div>
        <h2>My Tasks</h2>

        <form id="taskForm">
            <div class="form-grid">

                <div>
                    <label>Task title</label>
                    <input class="field" name="title"
                           placeholder="e.g. Revise Unit 2" required>
                </div>

                <div>
                    <label>Subject</label>
                    <select class="field" name="subject_id" required>
                        <option value="1">FLA — Formal Language and Automata Theory</option>
                        <option value="2">CG — Computer Graphics</option>
                        <option value="3">SE — Software Engineering</option>
                        <option value="4">OOPS — Object-Oriented Programming Language</option>
                        <option value="5">DAA — Design and Analysis of Algorithms</option>
                        <option value="6">SC — Soft Computing</option>
                        <option value="7">Predictive Modelling (IBM)</option>
                        <option value="8">Constitution of India</option>
                    </select>
                </div>

                <div>
                    <label>Due date</label>
                    <input class="field" type="date" name="date"
                           id="dueDate" required>
                </div>

                <div>
                    <label>Priority</label>
                    <select class="field" name="priority">
                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>
                    </select>
                </div>

                <div>
                    <label>Minutes</label>
                    <input class="field" type="number" name="minutes"
                           value="30" min="5" required>
                </div>

                <div>
                    <button class="btn-teal" type="submit">+ Add Task</button>
                </div>

            </div>
        </form>

        <div class="card">
            <h3>All tasks</h3>
            <div id="message" class="empty"></div>
            <div id="tasksList"></div>
        </div>
    </main>
</div>

<script>
const API_URL = "http://localhost:5001/api/tasks";

const taskForm = document.getElementById("taskForm");
const tasksList = document.getElementById("tasksList");
const message = document.getElementById("message");
const dueDate = document.getElementById("dueDate");

const today = new Date().toISOString().split("T")[0];
dueDate.value = today;

function showMessage(text, isError = false) {
    message.textContent = text;
    message.style.display = "block";
    message.style.color = isError ? "#b42318" : "";
}

function clearMessage() {
    message.textContent = "";
    message.style.display = "none";
}

function formatDate(dateValue) {
    if (!dateValue) return "No date";

    const date = new Date(dateValue);
    if (Number.isNaN(date.getTime())) return dateValue;

    return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function taskHTML(task) {
    return `
        <div class="task-row">
            <div>
                <strong>${escapeHTML(task.title)}</strong>
                <div class="muted">
                    ${escapeHTML(task.subject)} ·
                    ${formatDate(task.due_date)} ·
                    ${task.minutes} min ·
                    ${escapeHTML(task.priority)}
                </div>
            </div>

            <div class="task-status">
                ${Number(task.completed) === 1 ? "Completed" : "Pending"}
            </div>
        </div>
    `;
}

async function loadTasks() {
    clearMessage();

    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Could not load tasks.");
        }

        const tasks = await response.json();

        if (tasks.length === 0) {
            tasksList.innerHTML = '<div class="empty">No tasks yet.</div>';
            return;
        }

        tasksList.innerHTML = tasks.map(taskHTML).join("");

    } catch (error) {
        console.error(error);
        tasksList.innerHTML = "";
        showMessage(
            "Could not load tasks. Make sure the backend is running on port 5001.",
            true
        );
    }
}

taskForm.addEventListener("submit", async function (event) {
    event.preventDefault();
    clearMessage();

    const formData = new FormData(taskForm);

    const taskData = {
        title: formData.get("title"),
        subject_id: Number(formData.get("subject_id")),
        due_date: formData.get("date"),
        priority: formData.get("priority"),
        minutes: Number(formData.get("minutes"))
    };

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(taskData)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Failed to add task.");
        }

        showMessage("Task added successfully! 🎉");

        taskForm.reset();
        dueDate.value = today;

        await loadTasks();

    } catch (error) {
        console.error(error);
        showMessage(
            "Could not add task. Make sure the backend is running on port 5001.",
            true
        );
    }
});

loadTasks();
</script>

</body>
</html>
